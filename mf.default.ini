# MirrorFlux 配布用初期設定 / UTF-8
# 編集するファイル: mf.exe と同じフォルダーの mf.ini
# アプリを終了してから編集し、再起動すると確実に反映されます。
#
# 設定の順序
#   1. 一般設定・移動先   2. 音楽・外部音源   3. 拡張子の関連付け
#   4. ファイル一覧のキー 5. 各ビューアーのキー・表示   6. 配色
#
# 書式
#   %設定名 値                  : 設定名と値は空白またはタブで区切る
#   >KEY_キー名 フラグ &機能;    : キー割り当て
#   .拡張子 フラグ &機能;       : Enterで開くときの関連付け
#   # で始まる行はコメント。%theme_以外の設定値の後ろにコメントを付けない。
#
# キーの修飾: ----=通常 / -s--=Shift / --a-=Alt / ---c=Ctrl
# 併用例: -s-c=Shift+Ctrl。無効化は &none;。同じキー・修飾の最後の定義を優先。
# 省略したFキーは標準動作になるため、無効化するときは &none; を明記。

# ----------------------------------------------------------------------
# 1. 一般設定・移動先
# ----------------------------------------------------------------------
[settings]

# 起動時の左右フォルダー（終了時に最後の場所を保存）
# saveState: 1=終了時に左右のフォルダー・ソート順・ログレベルを保存
#            0=保存しない（終了時にこのファイルを書き換えません）
%leftPath   C:\
%rightPath  C:\
%saveState  1

# ウィンドウの高さ
# fileRows: ファイル一覧の表示行数 5～100。0=標準の高さ（既定）
# 行数に合わせてウィンドウの高さが変わります。画面に収まらない場合は
# 収まる行数まで減らします。サウンドビューアは、曲リストの行数が
# 減る場合だけ標準の高さで表示します。0のときの一覧は約27行です。
%fileRows  0

# ファイル一覧
# showIcons: 1=アイコンあり / 0=なし
# showHidden: 1=隠し・システムファイルを表示 / 0=非表示
# sortMode: name=名前 / size=サイズ / date=更新日時 / type=種類
# 左右の個別ソートは、アプリで変更すると保存されます。
%showIcons   1
%showHidden  0
%sortMode    name

# 文字表示
# fontFamily: 候補のフォントをカンマ区切りで指定
# fontSize: 8～32、既定14
%fontFamily  Consolas, BIZ UDGothic, MS Gothic
%fontSize    14

# 操作ログ
# logRows: 表示行数 1～20、既定6
# logLevel: 0=警告・エラー / 1=主要操作と結果 / 2=標準 / 3=詳細
%logRows   6
%logLevel  2

# ジャンプリスト（標準キー Shift+J / F10）
# 空欄は非表示。環境変数を使用可。相対パスはEXEのフォルダー基準。
# shell:Desktop / Downloads / Personal はWindowsに登録された場所を参照します。
# 空白を含むパスは引用符で囲んでも構いません。
# 一覧の表示名を指定するときは、パスの後ろに ,"表示名" を付けます。
# 例: %jumpPath04  "C:\My Documents","ドキュメント"
%jumpPath01  shell:Desktop
%jumpPath02  shell:Downloads
%jumpPath03  shell:Personal
%jumpPath04
%jumpPath05
%jumpPath06
%jumpPath07
%jumpPath08
%jumpPath09
%jumpPath10

# ----------------------------------------------------------------------
# 2. 音楽・外部音源
# ----------------------------------------------------------------------
[GME]

# 再生音量
# 0～100、既定50。Windows本体の音量やNDSIF実機出力には影響しません。
%masterVolume  50

# MDX用PDXの追加検索先
# MDXと同じフォルダーを優先。追加先を複数指定するときは ; 区切り。
# 相対パスはEXEのフォルダー基準。未指定なら次の行は空欄のままにします。
# 例: %pdxSearchPaths samples;D:\Music\PDX
%pdxSearchPaths

# NanoDrive 6/7/8 / NDSIF 実機出力
# true=有効 / false=無効。機器を使用しない場合はfalseのままにします。
# ND7: YM2413/YM2203/OPL/AY、ND8: YM2151/OKIM6258。各NDを同時使用可能。
%ND6-NDSIF  false
%ND7-NDSIF  false
%ND8-NDSIF  false

# 外部音源データ（ROM・波形・楽曲は同梱しません）
# YM2608のリズムには、利用者が用意した8192バイトの
# YM2608_ADPCM.ROMをmf.exeと同じフォルダーか、その下のromsフォルダーに置きます。INI指定は不要。
# ROMなし・サイズ不正の場合はリズムのみ無音。詳しくはEXTERNAL-DATA.txt。

# ----------------------------------------------------------------------
# 3. 拡張子の関連付け
# ----------------------------------------------------------------------
[extensions]
# 通常のEnterで使用。Shift+EnterはShiftの定義を優先し、なければWindowsの関連付けで開きます。


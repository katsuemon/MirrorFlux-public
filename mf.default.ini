.bat   ----  &textviewer;
.c     ----  &textviewer;
.cc    ----  &textviewer;
.cfg   ----  &textviewer;
.cpp   ----  &textviewer;
.cs    ----  &textviewer;
.cxx   ----  &textviewer;
.doc   ----  &textviewer;
.h     ----  &textviewer;
.hh    ----  &textviewer;
.hpp   ----  &textviewer;
.hxx   ----  &textviewer;
.ini   ----  &textviewer;
.json  ----  &textviewer;
.log   ----  &textviewer;
.man   ----  &textviewer;
.md    ----  &textviewer;
.ps1   ----  &textviewer;
.text  ----  &textviewer;
.txt   ----  &textviewer;
.xaml  ----  &textviewer;
.xml   ----  &textviewer;

# PDF
.pdf   ----  &pdfviewer;

# 画像（HEIC/HEIFはWindowsの対応画像コーデックが必要）
.ai    ----  &graphicviewer;
.bmp   ----  &graphicviewer;
.gif   ----  &graphicviewer;
.heic  ----  &graphicviewer;
.heif  ----  &graphicviewer;
.ico   ----  &graphicviewer;
.jpeg  ----  &graphicviewer;
.jpg   ----  &graphicviewer;
.png   ----  &graphicviewer;
.psd   ----  &graphicviewer;
.tif   ----  &graphicviewer;
.tiff  ----  &graphicviewer;
.webp  ----  &graphicviewer;

# 動画（Windows側のコーデックで再生。拡張子の登録だけでは再生可否は保証されません）
.avi   ----  &videoviewer;
.m4v   ----  &videoviewer;
.mkv   ----  &videoviewer;
.mov   ----  &videoviewer;
.mp4   ----  &videoviewer;
.mpeg  ----  &videoviewer;
.mpg   ----  &videoviewer;
.webm  ----  &videoviewer;
.wmv   ----  &videoviewer;

# 音源エミュレーション: 通常=サウンドバー / Shift=サウンドビューア
.ay    ----  &miniplayer;
.ay    -s--  &vgmplayer;
.gbs   ----  &miniplayer;
.gbs   -s--  &vgmplayer;
.gym   ----  &miniplayer;
.gym   -s--  &vgmplayer;
.hes   ----  &miniplayer;
.hes   -s--  &vgmplayer;
.kss   ----  &miniplayer;
.kss   -s--  &vgmplayer;
.mdx   ----  &miniplayer;
.mdx   -s--  &vgmplayer;
.nsf   ----  &miniplayer;
.nsf   -s--  &vgmplayer;
.nsfe  ----  &miniplayer;
.nsfe  -s--  &vgmplayer;
.s98   ----  &miniplayer;
.s98   -s--  &vgmplayer;
.sap   ----  &miniplayer;
.sap   -s--  &vgmplayer;
.spc   ----  &miniplayer;
.spc   -s--  &vgmplayer;
.vgm   ----  &miniplayer;
.vgm   -s--  &vgmplayer;
.vgz   ----  &miniplayer;
.vgz   -s--  &vgmplayer;

# 一般の音声ファイル: サウンドバー
.aac   ----  &miniplayer;
.flac  ----  &miniplayer;
.m4a   ----  &miniplayer;
.mp3   ----  &miniplayer;
.wav   ----  &miniplayer;
.wma   ----  &miniplayer;

# ----------------------------------------------------------------------
# 4. ファイル一覧のキー
# ----------------------------------------------------------------------
[keys.file]
# 外部アプリ起動の例（使用する実行ファイルに合わせてコメントを外してください）
# >KEY_E -s-- C:\Tools\viewer.exe %markfiles;
# >KEY_F3 -s-- "C:\Program Files\Editor\editor.exe" --new-window %markfiles;
# %markfiles は操作中パネルのマーク済みファイルを個別引数へ展開。未マークなら0件。
# 実行ファイルや引数に空白がある場合は引用符で囲みます。
# ここはファイル一覧の操作です。ビューアー内の操作は後続の各セクションで設定します。

# ファンクションキーの表示名
# 標準割り当ての表示名。割り当てを変更したキーは機能名を自動表示します。
%fn01  ヘルプ
%fn02  マーク
%fn03  表示
%fn04  名前変更
%fn05  コピー
%fn06  移動
%fn07  作成
%fn08  削除
%fn09  ソート
%fn10  パス選択
%fn11  更新
%fn12  終了

# [ 英字キー（アルファベット順） ]
>KEY_A      ---- &markall;
# Shift+A: マークをすべて解除 / Ctrl+A: マーク項目からアーカイブ作成
>KEY_A      -s-- &markclear;
>KEY_A      ---c &archive;
>KEY_C      ---- &filecopycheck;
>KEY_C      -s-- &filecopy;
>KEY_D      ---- &filedelete;
>KEY_G      ---- &graphicviewer;
# 任意の起動キーを割り当てる例（# を外すと有効）
# >KEY_G -s-- &videoviewer;
>KEY_I      ---- &incrimentalsearch;
>KEY_J      ---- &chdir;
>KEY_J      -s-- &jumplist;
>KEY_K      ---- &mkdir;
>KEY_L      ---- &drive;
>KEY_M      ---- &filemovecheck;
>KEY_M      -s-- &filemove;
>KEY_Q      ---c &exit;
>KEY_R      ---- &filerename;
>KEY_S      ---- &sort;
>KEY_V      ---- &textviewer;
>KEY_V      -s-- &hexviewer;

# [ 特殊キー ]
>KEY_-      ---- &samepath;
>KEY_\      ---- &chdir;
>KEY_DELETE ---- &filedelete;
>KEY_ENTER  ---- &extexec;
>KEY_ENTER  -s-- &extexecwin;
# 実行中のコピー・移動・削除・展開などを、確認してから中止
>KEY_ESC    ---- &opcancel;

# ファンクションキー F1～F12（キー操作と画面下部のファンクションキーのクリックで共通）
>KEY_F1     ---- &help;
>KEY_F2     ---- &mark;
>KEY_F3     ---- &view;
>KEY_F4     ---- &filerename;
>KEY_F5     ---- &filecopy;
>KEY_F6     ---- &filemove;
>KEY_F7     ---- &mkdir;
>KEY_F8     ---- &filedelete;
>KEY_F9     ---- &sort;
>KEY_F10    ---- &jumplist;
>KEY_F11    ---- &refresh;
>KEY_F12    ---- &exit;

# ----------------------------------------------------------------------
# 5-1. テキストビューアー
# ----------------------------------------------------------------------
[keys.text]

# ファンクションキーの表示名
# 標準割り当ての表示名。実行する機能は後続の >KEY_F 行で設定します。
%vfn01  ヘルプ
%vfn02  検索
%vfn03  次検索
%vfn04  前検索
%vfn05  コード
%vfn06  BIN表示
%vfn07  行指定
%vfn08  行番号
%vfn09  再読込
%vfn10  折り返し
%vfn11  マップ
%vfn12  閉じる

# 構文ハイライト
# tvHighlight: 1=有効 / 0=無効。tvSyntaxPathは外部構文定義のフォルダー。
%tvHighlight   1
%tvSyntaxPath  syntax

# 拡張子と構文定義の対応
# none=なし / auto=自動判定。拡張子ごとにini・json・xml・cpp・csharpなどを指定。
%tvSyntax_c     cpp
%tvSyntax_cc    cpp
%tvSyntax_cfg   auto
%tvSyntax_cpp   cpp
%tvSyntax_cs    csharp
%tvSyntax_cxx   cpp
%tvSyntax_h     cpp
%tvSyntax_hh    cpp
%tvSyntax_hpp   cpp
%tvSyntax_hxx   cpp
%tvSyntax_ini   ini
%tvSyntax_json  json
%tvSyntax_txt   none
%tvSyntax_xaml  xml
%tvSyntax_xml   xml

# 特定のファイルに構文定義を適用する例（必要な行だけ # を外して編集）
# %tvSyntaxRule "scripts\*.txt" scenario
# %tvSyntaxPrefix "scenario_" scenario

# 構文ハイライトの色（#RRGGBB）
# コメント
%tvColorComment        #808CA8
# 予約語
%tvColorKeyword        #B3A2FF
# 文字列
%tvColorString         #E8B887
# 数値
%tvColorNumber         #99C8F0
# 設定名
%tvColorKey            #85CDE0
# シナリオの音声番号
%tvColorScenarioVoice  #EBCB68
# URL
%tvColorUrl            #69C9FF
# セクション名
%tvColorSection        #D0B2F5

# 通常 F1～F12
>KEY_F1  ---- &help;          # ヘルプ
>KEY_F2  ---- &search;        # 検索
>KEY_F3  ---- &findnext;      # 次検索
>KEY_F4  ---- &findprevious;  # 前検索
>KEY_F5  ---- &encoding;      # 文字コード
>KEY_F6  ---- &hex;           # BIN表示
>KEY_F7  ---- &jump;          # 行移動
>KEY_F8  ---- &linenumbers;   # 行番号
>KEY_F9  ---- &reload;        # 再読込
>KEY_F10 ---- &wrap;          # 折り返し（初期状態は有効）
>KEY_F11 ---- &minimap;       # ミニマップ
>KEY_F12 ---- &close;         # 終了

# Shift+F1～F12（&none; は未割り当て）
>KEY_F1  -s-- &none;
>KEY_F2  -s-- &follow;        # 末尾追従
>KEY_F3  -s-- &regex;         # 正規表現
>KEY_F4  -s-- &matchcase;     # 大小区別
>KEY_F5  -s-- &previousfile;  # 前ファイル
>KEY_F6  -s-- &nextfile;      # 次ファイル
>KEY_F7  -s-- &none;
>KEY_F8  -s-- &copy;          # コピー
>KEY_F9  -s-- &none;
>KEY_F10 -s-- &syntax;        # 構文ハイライト切替
>KEY_F11 -s-- &none;
>KEY_F12 -s-- &none;


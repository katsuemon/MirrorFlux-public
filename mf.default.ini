>KEY_LEFT  -s-- &backward;    # 10秒戻る
>KEY_RIGHT -s-- &forward;     # 10秒進む
>KEY_DOWN  ---- &volumedown;  # 音量を下げる
>KEY_UP    ---- &volumeup;    # 音量を上げる
>KEY_M     ---- &mute;        # 消音
>KEY_HOME  ---- &beginning;   # 先頭へ移動
>KEY_ESC   ---- &close;       # 終了
>KEY_ENTER ---- &close;       # 終了

# 通常 F1～F12
>KEY_F1    ---- &help;        # ヘルプ
>KEY_F2    ---- &playpause;   # 再生/一時停止
>KEY_F3    ---- &backward;    # 10秒戻る
>KEY_F4    ---- &forward;     # 10秒進む
>KEY_F5    ---- &volumedown;  # 音量を下げる
>KEY_F6    ---- &volumeup;    # 音量を上げる
>KEY_F7    ---- &mute;        # 消音
>KEY_F8    ---- &stop;        # 停止
>KEY_F9    ---- &beginning;   # 先頭へ移動
>KEY_F10   ---- &none;
>KEY_F11   ---- &none;
>KEY_F12   ---- &close;       # 終了

# Shift+F1～F12（&none; は未割り当て）
>KEY_F1    -s-- &help;        # ヘルプ
